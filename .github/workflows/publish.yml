name: Publish To PyPI

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - src/**
      - README.pypi.md
      - .github/workflows/publish.yml
  workflow_dispatch:

jobs:
  release-check:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect whether pyproject version changed
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          event_name = os.environ["GITHUB_EVENT_NAME"]
          current = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]

          should_publish = event_name == "workflow_dispatch"

          if not should_publish:
              before = os.environ.get("GITHUB_EVENT_BEFORE", "")
              if before and before != "0" * 40:
                  previous_text = subprocess.check_output(
                      ["git", "show", f"{before}:pyproject.toml"],
                      text=True,
                  )
                  previous = tomllib.loads(previous_text)["project"]["version"]
                  should_publish = previous != current

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write(f"version={current}\n")
              fh.write(
                  "should_publish={value}\n".format(
                      value="true" if should_publish else "false"
                  )
              )

          print(f"Current version: {current}")
          print(f"Publish required: {should_publish}")
          PY
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: release-check
    if: needs.release-check.outputs.should_publish == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check built distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-check
      - build
    if: needs.release-check.outputs.should_publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/hsds-record-matcher/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
